[project]
name = "uk-planning-applications"
version = "0.1.0"
description = "Centralised planning application data for England"
requires-python = ">=3.13"
dependencies = [
    "browser-use",
    "modal",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]
lint = [
    "bandit>=1.9.4",
    "pre-commit>=4.5.1",
    "ruff>=0.15.6",
]

[tool.ruff]
target-version = "py313"
line-length = 119
indent-width = 4
exclude = [
    ".venv",
    ".git",
    "__pycache__",
    "data",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "B",     # flake8-bugbear
    "ANN",   # flake8-annotations
    "T20",   # flake8-print
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
]
ignore = [
    "ANN401",  # dynamically typed expressions (typing.Any) disallowed
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "S"]
"backend/scrapers/hackney.py" = ["T20"]
"backend/scrapers/haringey.py" = ["T20"]
"backend/modal_jobs/scrape.py" = ["T20"]
"backend/prompts/**/*.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.bandit]
exclude_dirs = [".venv", "tests"]
skips = [
    "B101",   # assert
    "B311",   # pseudo-random generators
    "B108",   # insecure temp file usage
]
